<script>
/* ═══════════════════════════════════════════
   미래형학교체육 '스마트점핑' — 프론트 로직
   ═══════════════════════════════════════════ */

function srv(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fn].apply(null, args);
  });
}

var S = {
  user: null, categories: [], videos: [], cart: [], favs: [],
  c1: null, c2: null, q: '', page: 1, pageSize: 24,
  sort: 'default',
  classes: [], loaded: false
};

/** 즐겨찾기 전용 가상 대분류 ID */
var FAV_ID = '__fav';

/** 라이브러리 정렬 방식 */
var SORTS = [
  { k: 'default', label: '기본순' },
  { k: 'views',   label: '조회수 많은순' },
  { k: 'short',   label: '재생시간 짧은순' },
  { k: 'long',    label: '재생시간 긴순' },
  { k: 'title',   label: '제목순' }
];

/** "mm:ss" / "h:mm:ss" → 초 */
function durSec(d) {
  var p = String(d || '').split(':').map(Number);
  if (p.some(isNaN) || !p.length) return 0;
  return p.reduce(function (a, n) { return a * 60 + n; }, 0);
}

var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function nfmt(n) { return Number(n || 0).toLocaleString('ko-KR'); }

function toast(msg) {
  var t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.hidden = true; }, 2400);
}

/* ═══════════ 로그인 ═══════════ */

/** 로그인 필요 여부 — 게스트면 안내하고 로그인 창을 연다 */
function needLogin(msg) {
  if (S.user) return false;
  toast(msg || '로그인이 필요합니다.');
  openAuth(false);
  return true;
}

function openAuth(signup) {
  showSignup(!!signup);
  $('#authTitle').textContent = signup ? '회원가입' : '로그인';
  $('#authModal').hidden = false;
  setTimeout(function () {
    var f = signup ? $('#suId') : $('#loginId');
    if (f) f.focus();
  }, 60);
}
function closeAuth() { $('#authModal').hidden = true; }

$('#authX').addEventListener('click', closeAuth);
$('#authModal').addEventListener('click', function (e) { if (e.target === $('#authModal')) closeAuth(); });
$('#btnLogin').addEventListener('click', function () { openAuth(false); });
$('#btnSignup').addEventListener('click', function (e) { e.preventDefault(); openAuth(true); });

$('#loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('#loginBtn'), msg = $('#loginMsg');
  btn.disabled = true; btn.textContent = '확인 중...'; msg.textContent = '';

  srv('api_login', $('#loginId').value, $('#loginPw').value)
    .then(function (r) {
      btn.disabled = false; btn.textContent = '로그인';
      if (!r.ok) { msg.textContent = r.msg; return; }
      S.user = r.user;
      try { localStorage.setItem('sj_user', JSON.stringify(r.user)); } catch (e) {}
      closeAuth();
      applyAuthUI();
      toast(r.user.name + '님, 반갑습니다.');
      // 로그인한 계정의 담기·즐겨찾기를 다시 받아온다
      return srv('api_bootstrap', S.user.id).then(function (d) {
        S.cart = d.playlist || [];
        S.favs = d.favorites || [];
        updateFab();
        renderGnb();
        renderRoute();
      });
    })
    .catch(function (err) {
      msg.textContent = '서버 오류: ' + err.message;
      btn.disabled = false; btn.textContent = '로그인';
    });
});

$('#btnLogout').addEventListener('click', function (e) {
  e.preventDefault();
  try { localStorage.removeItem('sj_user'); } catch (e) {}
  location.hash = '';
  location.reload();
});

/* ── 로그인 / 회원가입 전환 ── */
function showSignup(on) {
  $('#loginForm').hidden = on;
  $('#signupForm').hidden = !on;
  $('#toSignup').hidden = on;
  $('#toLogin').hidden = !on;
  $('#loginMsg').textContent = '';
  $('#suMsg').textContent = '';
}
$('#toSignup').addEventListener('click', function () { showSignup(true); });
$('#toLogin').addEventListener('click', function () { showSignup(false); });

$('#signupForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var msg = $('#suMsg'), btn = $('#suBtn');
  var obj = {
    id: $('#suId').value.trim(), pw: $('#suPw').value, name: $('#suName').value.trim(),
    org: $('#suOrg').value.trim(), region: $('#suRegion').value.trim()
  };
  if (!obj.id || !obj.pw || !obj.name) { msg.textContent = '아이디·비밀번호·이름은 필수입니다.'; return; }
  if (!/^[A-Za-z0-9_]{4,20}$/.test(obj.id)) {
    msg.textContent = '아이디는 영문·숫자·밑줄 4~20자로 입력하세요.'; return;
  }
  if (obj.pw.length < 4) { msg.textContent = '비밀번호는 4자 이상이어야 합니다.'; return; }
  if (obj.pw !== $('#suPw2').value) { msg.textContent = '비밀번호가 서로 다릅니다.'; return; }

  btn.disabled = true; btn.textContent = '가입 중...'; msg.textContent = '';
  srv('api_signup', obj)
    .then(function (r) {
      btn.disabled = false; btn.textContent = '회원가입';
      if (!r.ok) { msg.textContent = r.msg; return; }
      showSignup(false);
      $('#loginId').value = obj.id;
      $('#loginPw').value = '';
      $('#loginMsg').style.color = '#059669';
      $('#loginMsg').textContent = '가입이 완료되었습니다. 로그인해 주세요.';
      setTimeout(function () { $('#loginMsg').style.color = ''; }, 4000);
    })
    .catch(function (err) {
      btn.disabled = false; btn.textContent = '회원가입';
      msg.textContent = '서버 오류: ' + err.message;
    });
});


/* ═══════════ 권한 ═══════════ */

/** 로그인 없이 볼 수 있는 화면 */
var GUEST_NAV = ['library', 'guide', 'textbook'];

/** 이 권한이 해당 메뉴를 쓸 수 있는가 (data-role 미지정이면 로그인 사용자 전원 허용) */
function canUse(el) {
  var nav = el.getAttribute('data-nav') || '';
  if (!S.user) return GUEST_NAV.indexOf(nav) >= 0;
  var need = el.getAttribute('data-role');
  if (!need) return true;
  return need.split(',').indexOf(S.user.role) >= 0;
}

/** 권한·로그인 상태에 맞지 않는 메뉴를 감춘다 */
function applyRole() {
  $$('.side-nav > a[data-nav], .sub-nav a').forEach(function (a) { a.hidden = !canUse(a); });
  // 마이페이지 하위가 전부 가려지면 상위도 의미가 없다
  var visibleSubs = $$('#subMypage a').filter(function (a) { return !a.hidden; });
  $('#navMypage').hidden = visibleSubs.length === 0;
  if (visibleSubs.length === 0) $('#subMypage').classList.remove('open');
}

/** 로그인/게스트에 따라 사이드바 카드를 바꾼다 */
function applyAuthUI() {
  var on = !!S.user;
  $('#guestCard').hidden = on;
  $('#userCard').hidden = !on;
  if (on) {
    $('#userName').textContent = S.user.name || S.user.id;
    $('#userRole').textContent = S.user.role || '교사';
    $('#userRole').setAttribute('data-r', S.user.role || '교사');
  }
  applyRole();
}

/** 권한 없는 화면으로 직접 들어오면 홈으로 되돌린다 */
function guardRoute(navKey) {
  var el = $('.side-nav [data-nav="' + navKey + '"]');
  if (el && !canUse(el)) {
    if (!S.user) { toast('로그인이 필요한 메뉴입니다.'); openAuth(false); }
    else toast(S.user.role + ' 계정은 이용할 수 없는 메뉴입니다.');
    location.hash = '#/library';
    return false;
  }
  return true;
}

function startApp() {
  applyAuthUI();
  startClock();

  if (!location.hash) location.hash = '#/library';
  renderRoute();

  srv('api_bootstrap', S.user ? S.user.id : '')
    .then(function (d) {
      S.categories = d.categories || [];
      S.videos = d.videos || [];
      S.cart = d.playlist || [];
      S.favs = d.favorites || [];
      S.loaded = true;
      if (!S.c1 && S.categories.length) S.c1 = S.categories[0].id;
      renderGnb();
      updateFab();
      renderRoute();
    })
    .catch(function (err) {
      $('#view').innerHTML = '<div class="empty"><span class="ico">⚠️</span>' +
        '<b>데이터를 불러오지 못했습니다</b>' + esc(err.message) +
        '<br><br>Apps Script 에서 <code>초기설정_실행()</code> 을 먼저 실행했는지 확인하세요.</div>';
    });
}

/* ═══════════ 시계 ═══════════ */

function startClock() {
  var DAY = ['일', '월', '화', '수', '목', '금', '토'];
  function tick() {
    var d = new Date(), h = d.getHours();
    var ampm = h < 12 ? '오전' : '오후';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    var p = function (n) { return ('0' + n).slice(-2); };
    $('#clock').textContent =
      d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) +
      ' ' + DAY[d.getDay()] + ' ' + ampm + ' ' + h12 + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);
}

/* ═══════════ 라우터 ═══════════ */

window.addEventListener('hashchange', renderRoute);

function renderRoute() {
  var h = location.hash.replace('#/', '') || 'library';
  var parts = h.split('/'), key = parts[0], sub = parts[1] || '';
  var navKey = (key === 'mypage') ? (sub || 'info') : key;

  // 권한 확인 — 통과 못 하면 홈으로 되돌아간다
  if (!guardRoute(navKey)) return;

  $$('.side-nav > a, .sub-nav a').forEach(function (a) { a.classList.remove('active'); });
  var act = $('[data-nav="' + navKey + '"]');
  if (act) act.classList.add('active');
  if (key === 'mypage') {
    $('#subMypage').classList.add('open');
    $('#navMypage .chev').classList.add('up');
  }

  $('#fabCart').hidden = (key !== 'library');

  if (key === 'guide') return viewGuide();
  if (key === 'library') return viewLibrary();
  if (key === 'classes') return viewClasses();
  if (key === 'members') return viewMembers();
  if (key === 'myatt') return viewMyAttendance();
  if (key === 'textbook') return viewTextbook();
  if (key === 'mypage') {
    if (sub === 'equipment') return viewEquipment();
    if (sub === 'schedule') return viewSchedule();
    if (sub === 'withdraw') return viewWithdraw();
    return viewProfile();
  }
  viewLibrary();
}

$('#navMypage').addEventListener('click', function (e) {
  e.preventDefault();
  $('#subMypage').classList.toggle('open');
  $('#navMypage .chev').classList.toggle('up');
});

/* 로고 → 홈. 검색어·필터까지 초기화해서 처음 들어온 상태로 되돌린다 */
$('#brandHome').addEventListener('click', function (e) {
  e.preventDefault();
  S.q = ''; S.c2 = null; S.page = 1;
  if (S.categories.length) S.c1 = S.categories[0].id;
  if (location.hash === '#/library') viewLibrary();
  else location.hash = '#/library';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ═══════════ GNB ═══════════ */

function countIn(c1, c2) {
  return S.videos.filter(function (v) {
    return v.c1 === c1 && (!c2 || v.c2 === c2);
  }).length;
}

function renderGnb() {
  // 영상이 하나도 없는 대분류는 감춘다
  var shown = S.categories.filter(function (c) { return countIn(c.id) > 0; });
  if (shown.length && S.c1 !== FAV_ID &&
      !shown.some(function (c) { return c.id === S.c1; })) S.c1 = shown[0].id;

  $('#gnbNav').innerHTML = shown.map(function (c) {
    return '<a href="#/library" data-c1="' + esc(c.id) + '">' + esc(c.name) + '</a>';
  }).join('') +
    '<a href="#/library" class="gnb-fav" data-c1="' + FAV_ID + '">★ 즐겨찾기' +
      '<span class="gnb-fav-cnt" id="favCnt">' + S.favs.length + '</span></a>';

  $$('#gnbNav a').forEach(function (a) {
    a.addEventListener('click', function () {
      S.c1 = a.dataset.c1; S.c2 = null; S.page = 1; S.q = '';
      if (location.hash === '#/library') viewLibrary(); else location.hash = '#/library';
    });
  });
  markGnb();
}

function markGnb() {
  $$('#gnbNav a').forEach(function (a) { a.classList.toggle('active', a.dataset.c1 === S.c1); });
}

/* ═══════════ 라이브러리 ═══════════ */

function viewLibrary() {
  if (!S.loaded) { $('#view').innerHTML = skeleton(); return; }
  markGnb();

  var isFav = (S.c1 === FAV_ID);
  var cat = S.categories.filter(function (c) { return c.id === S.c1; })[0];
  // 영상이 있는 소분류만 노출
  var subs = (cat ? cat.subs : []).filter(function (s) { return countIn(S.c1, s.id) > 0; });

  var chips = isFav ? '' :
    '<button class="chip' + (S.c2 === null ? ' on' : '') + '" data-c2="">' +
      '전체<span class="chip-count">' + countIn(S.c1) + '</span></button>' +
    subs.map(function (s) {
      return '<button class="chip' + (S.c2 === s.id ? ' on' : '') + '" data-c2="' + esc(s.id) + '">' +
        esc(s.name) + (s.badge ? '<span class="nb">N</span>' : '') +
        '<span class="chip-count">' + countIn(S.c1, s.id) + '</span></button>';
    }).join('');

  $('#view').innerHTML =
    mainHero() +
    '<div class="search-row"><div class="search-box">' +
      '<input type="text" id="q" placeholder="영상 제목으로 검색" value="' + esc(S.q) + '">' +
      '<button id="qBtn" aria-label="검색">🔍</button>' +
    '</div></div>' +
    '<div class="chips">' + chips + '</div>' +
    '<div class="list-head">' +
      '<h2 class="list-title" id="listTitle"></h2>' +
      '<div class="list-tools">' +
        '<select id="sortSel" class="sort-sel" aria-label="정렬">' +
          SORTS.map(function (s) {
            return '<option value="' + s.k + '"' + (S.sort === s.k ? ' selected' : '') + '>' + s.label + '</option>';
          }).join('') +
        '</select>' +
        '<button class="btn btn-ghost btn-sm" id="pickAll">이 페이지 전체담기</button>' +
      '</div>' +
    '</div>' +
    '<div class="grid" id="grid"></div>' +
    '<div class="pager" id="pager"></div>';

  bindMainHero();
  $$('.chip').forEach(function (b) {
    b.addEventListener('click', function () { S.c2 = b.dataset.c2 || null; S.page = 1; viewLibrary(); });
  });
  $('#qBtn').addEventListener('click', doSearch);
  $('#q').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
  $('#pickAll').addEventListener('click', pickPage);
  $('#sortSel').addEventListener('change', function () {
    S.sort = $('#sortSel').value; S.page = 1; renderGrid();
  });

  renderGrid();
}

function doSearch() { S.q = $('#q').value.trim(); S.page = 1; renderGrid(); }

function filtered() {
  var q = S.q.toLowerCase();
  var list = S.videos.filter(function (v) {
    if (S.q) return v.title.toLowerCase().indexOf(q) >= 0;   // 검색은 전체 대상
    if (S.c1 === FAV_ID) return S.favs.indexOf(v.id) >= 0;   // 즐겨찾기만
    if (S.c1 && v.c1 !== S.c1) return false;
    if (S.c2 && v.c2 !== S.c2) return false;
    return true;
  });

  if (S.sort === 'views')      list.sort(function (a, b) { return b.views - a.views; });
  else if (S.sort === 'short') list.sort(function (a, b) { return durSec(a.dur) - durSec(b.dur); });
  else if (S.sort === 'long')  list.sort(function (a, b) { return durSec(b.dur) - durSec(a.dur); });
  else if (S.sort === 'title') list.sort(function (a, b) { return a.title.localeCompare(b.title, 'ko'); });
  return list;
}

function subName(id) {
  for (var i = 0; i < S.categories.length; i++) {
    var subs = S.categories[i].subs;
    for (var j = 0; j < subs.length; j++) if (subs[j].id === id) return subs[j].name;
  }
  return '';
}
function catName(id) {
  var c = S.categories.filter(function (x) { return x.id === id; })[0];
  return c ? c.name : '';
}

var PH_GRAD = [
  ['#4f46e5', '#7c3aed'], ['#0ea5e9', '#22d3ee'], ['#f59e0b', '#ef4444'],
  ['#059669', '#84cc16'], ['#7c3aed', '#ec4899'], ['#0f172a', '#334155']
];
function gradOf(id) {
  var n = 0;
  for (var i = 0; i < id.length; i++) n = (n * 31 + id.charCodeAt(i)) % 997;
  return PH_GRAD[n % PH_GRAD.length];
}

/* maxresdefault 가 없는 영상 목록 — `node tools/chk-thumb.js` 가 채운다.
   여기 있는 영상은 처음부터 hqdefault 를 요청해서 404 를 만들지 않는다. */
var NO_MAXRES = {'4FR8-GOwlWs':1, '4deNtH6p2U0':1, '7gjp3gdZE2U':1, '8H44pw20-74':1, 'DnUmpP-_Chk':1, 'L73dXfVsLKc':1, 'P6RU0NUgu8E':1, 'gBsXje_teyg':1, 'l9chx0Z7qBw':1, 'pZnefFq4aDk':1, 'zPGci2cL6j4':1};

function thumbUrl(yt) {
  return 'https://i.ytimg.com/vi/' + yt + (NO_MAXRES[yt] ? '/hqdefault.jpg' : '/maxresdefault.jpg');
}

function thumbHtml(v) {
  if (v.yt) {
    // 고해상도부터 시도하고, 없으면 아래에서 hqdefault 로 자동 대체
    return '<img class="yt-thumb" data-yt="' + esc(v.yt) + '" alt="" loading="lazy" ' +
      'src="' + esc(thumbUrl(v.yt)) + '">';
  }
  var g = gradOf(v.id);
  return '<div class="vthumb-ph" style="background:linear-gradient(145deg,' + g[0] + ',' + g[1] + ')">' +
    esc(v.title) + '</div>';
}

/**
 * 썸네일 폴백.
 * maxresdefault 는 없는 영상이 있고, 유튜브가 404 대신 회색 placeholder 를
 * 200 으로 돌려주는 경우도 있다. 그래서 에러뿐 아니라 "너무 작게 로드된 경우"까지
 * 잡아서 항상 존재하는 hqdefault(480x360) 로 갈아끼운다.
 */
function bindThumbFallback(root) {
  $$('img.yt-thumb', root).forEach(function (img) {
    if (img.dataset.fb) return;
    img.dataset.fb = '1';
    var fb = function () {
      var alt = 'https://i.ytimg.com/vi/' + img.dataset.yt + '/hqdefault.jpg';
      if (img.src === alt) return;
      img.src = alt;
    };
    img.addEventListener('error', fb);
    img.addEventListener('load', function () {
      if (img.naturalWidth && img.naturalWidth < 320) fb();
    });
    if (img.complete && img.naturalWidth && img.naturalWidth < 320) fb();
  });
}

function renderGrid() {
  var list = filtered();
  var total = list.length;
  var pages = Math.max(1, Math.ceil(total / S.pageSize));
  if (S.page > pages) S.page = pages;
  var slice = list.slice((S.page - 1) * S.pageSize, S.page * S.pageSize);

  var lt = $('#listTitle');
  if (lt) {
    lt.innerHTML = S.q
      ? '"' + esc(S.q) + '" 검색결과 <small>' + total + '건</small>'
      : esc(S.c2 ? subName(S.c2) : catName(S.c1)) + ' <small>' + total + '건</small>';
  }

  if (!slice.length) {
    $('#grid').innerHTML =
      '<div class="empty" style="grid-column:1/-1"><span class="ico">🔍</span>' +
      '<b>결과가 없습니다</b>다른 검색어나 분류를 선택해 보세요.</div>';
    $('#pager').innerHTML = '';
    return;
  }

  $('#grid').innerHTML = slice.map(function (v) {
    var picked = S.cart.indexOf(v.id) >= 0;
    var faved = S.favs.indexOf(v.id) >= 0;
    return '<article class="vcard' + (picked ? ' picked' : '') + '" data-id="' + esc(v.id) + '">' +
      '<label class="vpick" title="수업에 담기"><input type="checkbox" ' + (picked ? 'checked' : '') + '><i>✓</i></label>' +
      '<button class="vfav' + (faved ? ' on' : '') + '" data-fav="' + esc(v.id) + '" ' +
        'title="' + (faved ? '즐겨찾기 해제' : '즐겨찾기') + '" aria-label="즐겨찾기">★</button>' +
      '<div class="vthumb" data-play="' + esc(v.id) + '">' + thumbHtml(v) +
        '<div class="vthumb-play"><i>▶</i></div>' +
        '<span class="vthumb-views">조회 ' + nfmt(v.views) + '</span>' +
        '<span class="vthumb-meta">' + esc(v.dur) + '</span>' +
      '</div>' +
      '<div class="vcard-body">' +
        '<h3 class="vcard-title">' + esc(v.title) + '</h3>' +
        '<div class="vcard-path"><b>' + esc(catName(v.c1)) + '</b> › ' + esc(subName(v.c2)) + '</div>' +
      '</div>' +
    '</article>';
  }).join('');

  bindThumbFallback($('#grid'));

  $$('#grid .vpick input').forEach(function (cb) {
    cb.addEventListener('change', function () {
      if (needLogin('로그인하면 영상을 담을 수 있습니다.')) { cb.checked = false; return; }
      var card = cb.closest('.vcard');
      toggleCart(card.dataset.id, cb.checked);
      card.classList.toggle('picked', cb.checked);
      if (cb.checked) bumpFab();
    });
  });
  $$('#grid .vthumb').forEach(function (t) {
    t.addEventListener('click', function () { openPlayer([t.dataset.play]); });
  });
  $$('#grid .vfav').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (needLogin('로그인하면 즐겨찾기를 쓸 수 있습니다.')) return;
      toggleFav(b.dataset.fav);
      // 즐겨찾기 화면에서 해제하면 목록에서 빠져야 한다
      if (S.c1 === FAV_ID) renderGrid();
      else {
        var on = S.favs.indexOf(b.dataset.fav) >= 0;
        b.classList.toggle('on', on);
        b.title = on ? '즐겨찾기 해제' : '즐겨찾기';
      }
    });
  });

  renderPager(pages);
}

function renderPager(pages) {
  if (pages <= 1) { $('#pager').innerHTML = ''; return; }
  var html = '<button ' + (S.page === 1 ? 'disabled' : '') + ' data-p="1">‹‹</button>';
  var from = Math.max(1, S.page - 2), to = Math.min(pages, from + 4);
  from = Math.max(1, to - 4);
  for (var i = from; i <= to; i++) {
    html += '<button class="' + (i === S.page ? 'on' : '') + '" data-p="' + i + '">' + i + '</button>';
  }
  html += '<button ' + (S.page === pages ? 'disabled' : '') + ' data-p="' + pages + '">››</button>';
  $('#pager').innerHTML = html;
  $$('#pager button').forEach(function (b) {
    b.addEventListener('click', function () {
      S.page = Number(b.dataset.p); renderGrid();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function skeleton() {
  var c = '';
  for (var i = 0; i < 8; i++) c += '<div class="sk sk-card"></div>';
  return '<div class="search-row"><div class="search-box"><input placeholder="불러오는 중..."><button>🔍</button></div></div>' +
         '<div class="chips"><span class="sk" style="width:80px;height:34px;border-radius:99px"></span>' +
         '<span class="sk" style="width:120px;height:34px;border-radius:99px"></span>' +
         '<span class="sk" style="width:100px;height:34px;border-radius:99px"></span></div>' +
         '<div class="grid">' + c + '</div>';
}

/* ═══════════ 영상담기 ═══════════ */

function toggleCart(id, on) {
  var i = S.cart.indexOf(id);
  if (on && i < 0) S.cart.push(id);
  if (!on && i >= 0) S.cart.splice(i, 1);
  updateFab();
  saveCartDebounced();
}

function pickPage() {
  if (needLogin('로그인하면 영상을 담을 수 있습니다.')) return;
  var added = 0;
  $$('#grid .vcard').forEach(function (card) {
    var cb = $('input[type=checkbox]', card);
    if (!cb.checked) { cb.checked = true; card.classList.add('picked'); toggleCart(card.dataset.id, true); added++; }
  });
  bumpFab();
  toast(added ? added + '개를 담았습니다.' : '이미 모두 담겨 있습니다.');
}

/* ═══════════ 즐겨찾기 ═══════════ */

function toggleFav(id) {
  var i = S.favs.indexOf(id);
  if (i < 0) { S.favs.push(id); toast('즐겨찾기에 담았습니다.'); }
  else { S.favs.splice(i, 1); toast('즐겨찾기에서 뺐습니다.'); }
  if ($('#favCnt')) $('#favCnt').textContent = S.favs.length;
  saveFavDebounced();
}

var favTimer = null;
function saveFavDebounced() {
  if (!S.user) return;   // 게스트는 저장하지 않는다
  clearTimeout(favTimer);
  favTimer = setTimeout(function () {
    srv('api_saveFavorites', S.user.id, S.favs).catch(function () {});
  }, 800);
}

function updateFab() { $('#fabCount').textContent = S.cart.length; }
function bumpFab() {
  var f = $('#fabCart');
  f.classList.remove('pulse'); void f.offsetWidth; f.classList.add('pulse');
}

var saveTimer = null;
function saveCartDebounced() {
  if (!S.user) return;   // 게스트는 저장하지 않는다
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    srv('api_savePlaylist', S.user.id, S.cart).catch(function () {});
  }, 900);
}

$('#fabCart').addEventListener('click', function () {
  if (needLogin('로그인하면 영상을 담을 수 있습니다.')) return;
  openCartModal();
});
$('#btnStartClass').addEventListener('click', function () {
  if (needLogin()) return;
  if (!S.cart.length) { toast('먼저 영상을 담아주세요.'); return; }
  openPlayer(S.cart.slice());
});

function vById(id) { return S.videos.filter(function (x) { return x.id === id; })[0]; }

function openCartModal() {
  if (!S.cart.length) {
    modal('담은 영상', '<div class="empty"><span class="ico">🎬</span><b>담은 영상이 없습니다</b>' +
      '카드 왼쪽 위 체크박스를 눌러 수업에 쓸 영상을 담아보세요.</div>', '');
    return;
  }
  var body = S.cart.map(function (id, i) {
    var v = vById(id); if (!v) return '';
    var th = v.yt ? '<img class="yt-thumb" data-yt="' + esc(v.yt) +
      '" src="https://i.ytimg.com/vi/' + esc(v.yt) + '/mqdefault.jpg" alt="">' : '';
    return '<div class="cart-item">' +
      '<span class="cart-no">' + (i + 1) + '</span>' +
      '<div class="cart-th">' + th + '</div>' +
      '<div class="cart-nm">' + esc(v.title) + '<br><span class="cart-dur">' + esc(v.dur) + '</span></div>' +
      '<button class="btn btn-ghost btn-sm" data-up="' + esc(id) + '" title="위로">▲</button>' +
      '<button class="btn btn-ghost btn-sm" data-rm="' + esc(id) + '" title="빼기">✕</button>' +
    '</div>';
  }).join('');

  modal('담은 영상 ' + S.cart.length + '개', body,
    '<button class="btn btn-ghost" id="cartClear">전체 비우기</button>' +
    '<button class="btn btn-primary" id="cartStart">▶ 수업시작</button>');

  bindThumbFallback($('#modalBody'));

  $$('[data-rm]').forEach(function (b) {
    b.addEventListener('click', function () {
      toggleCart(b.dataset.rm, false); openCartModal();
      if (location.hash === '#/library') renderGrid();
    });
  });
  $$('[data-up]').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = S.cart.indexOf(b.dataset.up);
      if (i > 0) { S.cart.splice(i - 1, 0, S.cart.splice(i, 1)[0]); saveCartDebounced(); openCartModal(); }
    });
  });
  $('#cartClear').addEventListener('click', function () {
    S.cart = []; updateFab(); saveCartDebounced(); closeModal();
    if (location.hash === '#/library') renderGrid();
  });
  $('#cartStart').addEventListener('click', function () { closeModal(); openPlayer(S.cart.slice()); });
}

/* ═══════════ 수업 플레이어 ═══════════ */

var P = { list: [], idx: 0, yt: null, demoTimer: null, demoLeft: 0, playing: false };
var YT_READY = false, ytQueue = null;

(function () {
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
window.onYouTubeIframeAPIReady = function () {
  YT_READY = true;
  if (ytQueue) { var f = ytQueue; ytQueue = null; f(); }
};

function openPlayer(ids) {
  P.list = ids.map(vById).filter(Boolean);
  if (!P.list.length) { toast('재생할 영상이 없습니다.'); return; }
  P.idx = 0;
  $('#player').hidden = false;
  $('#plCount').textContent = P.list.length + '개';
  document.body.style.overflow = 'hidden';
  renderPlayerList();
  playAt(0);
}

function closePlayer() {
  stopDemo(); ytQueue = null;
  if (P.yt && P.yt.destroy) { try { P.yt.destroy(); } catch (e) {} }
  P.yt = null;
  $('#plScreen').innerHTML = '';
  $('#player').hidden = true;
  document.body.style.overflow = '';
}

$('#plClose').addEventListener('click', closePlayer);
$('#plPrev').addEventListener('click', function () { playAt(P.idx - 1); });
$('#plNext').addEventListener('click', function () { playAt(P.idx + 1); });
$('#plToggle').addEventListener('click', togglePlay);
document.addEventListener('keydown', function (e) {
  if ($('#player').hidden) return;
  if (e.key === 'Escape') closePlayer();
  if (e.key === 'ArrowRight') playAt(P.idx + 1);
  if (e.key === 'ArrowLeft') playAt(P.idx - 1);
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

function renderPlayerList() {
  $('#plList').innerHTML = P.list.map(function (v, i) {
    return '<li class="' + (i === P.idx ? 'on' : '') + '" data-i="' + i + '">' +
      '<span class="pl-no">' + (i + 1) + '</span>' +
      '<span class="pl-nm">' + esc(v.title) + '<span class="pl-dur">' + esc(v.dur) + '</span></span>' +
    '</li>';
  }).join('');
  $$('#plList li').forEach(function (li) {
    li.addEventListener('click', function () { playAt(Number(li.dataset.i)); });
  });
}

function playAt(i) {
  if (i < 0) i = 0;
  if (i >= P.list.length) {
    if ($('#plLoop').checked) i = 0;
    else { toast('수업 재생목록이 끝났습니다.'); closePlayer(); return; }
  }
  P.idx = i;
  var v = P.list[i];

  $('#plTitle').textContent = v.title;
  $('#plPos').textContent = i + 1;
  $('#plTotal').textContent = P.list.length;
  $$('#plList li').forEach(function (li, k) {
    li.classList.toggle('on', k === i);
    if (k === i) li.scrollIntoView({ block: 'nearest' });
  });

  srv('api_addView', v.id).catch(function () {});

  stopDemo(); ytQueue = null;
  if (P.yt && P.yt.destroy) { try { P.yt.destroy(); } catch (e) {} P.yt = null; }
  $('#plScreen').innerHTML = '';

  if (!v.yt) { startDemo(v); return; }
  if (!YT_READY) {
    $('#plScreen').innerHTML = '<div class="demo-screen"><div class="demo-tag">Loading</div>' +
      '<div class="demo-title">' + esc(v.title) + '</div>' +
      '<div class="demo-note">유튜브 플레이어를 불러오는 중입니다…</div></div>';
    ytQueue = function () { if (P.idx === i) mountYT(v, i); };
    return;
  }
  mountYT(v, i);
}

function mountYT(v, i) {
  var holder = document.createElement('div');
  $('#plScreen').innerHTML = '';
  $('#plScreen').appendChild(holder);
  P.yt = new YT.Player(holder, {
    videoId: v.yt,
    playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: function (e) { e.target.playVideo(); P.playing = true; syncToggle(); },
      onStateChange: function (e) {
        if (e.data === YT.PlayerState.ENDED) { playAt(P.idx + 1); return; }
        P.playing = (e.data === YT.PlayerState.PLAYING);
        syncToggle();
      },
      onError: function (e) { if (P.idx === i) ytError(v, e.data); }
    }
  });
}

/** 유튜브 재생 실패 — 5초 뒤 자동으로 다음 영상 */
function ytError(v, code) {
  var why = ({
    2: '영상 주소가 올바르지 않습니다',
    5: '이 브라우저에서 재생할 수 없습니다',
    100: '삭제되었거나 비공개 영상입니다',
    101: '외부 재생이 허용되지 않은 영상입니다',
    150: '외부 재생이 허용되지 않은 영상입니다'
  })[code] || '재생할 수 없는 영상입니다';

  P.playing = false; syncToggle();
  var left = 5;
  $('#plScreen').innerHTML =
    '<div class="err-screen"><div class="demo-tag">재생 오류</div>' +
      '<div class="demo-title">' + esc(v.title) + '</div>' +
      '<div class="demo-note">' + esc(why) + ' (코드 ' + code + ')<br>' +
      '<b id="errLeft">5</b>초 뒤 다음 영상으로 넘어갑니다.<br><br>' +
      '유튜브에서 직접 보기: <a href="https://www.youtube.com/watch?v=' + esc(v.yt) +
      '" target="_blank" rel="noopener" style="color:#818cf8">youtu.be/' + esc(v.yt) + '</a></div></div>';

  stopDemo();
  P.demoTimer = setInterval(function () {
    left--;
    var el = $('#errLeft'); if (el) el.textContent = left;
    if (left <= 0) { stopDemo(); playAt(P.idx + 1); }
  }, 1000);
}

/** youtube_id 가 비어 있는 영상 — 10초 뒤 자동으로 다음 */
function startDemo(v) {
  P.demoLeft = 10; P.playing = true; syncToggle();
  $('#plScreen').innerHTML =
    '<div class="demo-screen"><div class="demo-tag">Sample Mode</div>' +
      '<div class="demo-title">' + esc(v.title) + '</div>' +
      '<div class="demo-timer" id="demoTimer">10</div>' +
      '<div class="demo-note">이 항목은 아직 유튜브 영상이 연결되지 않았습니다. 10초 뒤 다음으로 넘어갑니다.<br>' +
      '시트 <b>videos</b> 탭의 <b>youtube_id</b> 열을 채우면 여기서 바로 재생됩니다.</div></div>';
  P.demoTimer = setInterval(tickDemo, 1000);
}

function tickDemo() {
  P.demoLeft--;
  var el = $('#demoTimer'); if (el) el.textContent = P.demoLeft;
  if (P.demoLeft <= 0) { stopDemo(); playAt(P.idx + 1); }
}

function stopDemo() { if (P.demoTimer) { clearInterval(P.demoTimer); P.demoTimer = null; } }

function togglePlay() {
  if (P.yt && P.yt.pauseVideo) {
    if (P.playing) P.yt.pauseVideo(); else P.yt.playVideo();
    return;
  }
  if (P.demoTimer) { stopDemo(); P.playing = false; }
  else { P.playing = true; P.demoTimer = setInterval(tickDemo, 1000); }
  syncToggle();
}

function syncToggle() { $('#plToggle').textContent = P.playing ? '⏸ 일시정지' : '▶ 재생'; }

/* ═══════════ 안내 캐릭터 ═══════════

var TUT = { sel:{}, off:{}, edit:null };

/** 지금 펼쳐야 할 단계 — 아직 안 고른 첫 단계, 다 골랐으면 -1 */
function tutActive() {
  if (TUT.edit !== null && TUT.edit !== undefined) return TUT.edit;
  for (var i = 0; i < TUT_STEPS.length; i++) if (!TUT.sel[TUT_STEPS[i].key]) return i;
  return -1;
}

/** 한 단계에 보여줄 후보 4편 (조회수 순, "다른 영상 보기" 로 4편씩 회전) */
function tutOptions(st) {
  var pool = S.videos.filter(st.pick);
  if (!pool.length) pool = S.videos.slice();
  pool.sort(function (a, b) { return (b.views || 0) - (a.views || 0); });
  var off = TUT.off[st.key] || 0, out = [];
  for (var i = 0; i < Math.min(4, pool.length); i++) out.push(pool[(off + i) % pool.length]);
  return { list: out, total: pool.length };
}

function fmtMin(sec) {
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + '분' + (s ? ' ' + s + '초' : '');
}

function renderTut() {
  var act = tutActive();

  $('#tutRail').innerHTML = TUT_STEPS.map(function (st, i) {
    var done = !!TUT.sel[st.key];
    var cls = i === act ? 'on' : (done ? 'done' : '');
    return '<span class="' + cls + '">' + (done && i !== act ? '✓ ' : '') +
      st.no + '. ' + esc(st.title) + '</span>';
  }).join('');

  var html = TUT_STEPS.map(function (st, i) {
    var sel = TUT.sel[st.key] ? vById(TUT.sel[st.key]) : null;
    var head =
      '<div class="tut-step-top">' +
        '<span class="tut-no" style="background:' + st.color + '">' + st.no + '차시</span>' +
        '<h4>' + esc(st.title) + '</h4>' +
        '<span class="path">' + esc(st.path) + '</span>' +
      '</div>';

    /* 펼쳐진 단계 — 캐릭터 안내 + 실제 영상 후보 */
    if (i === act) {
      var o = tutOptions(st);
      var opts = o.list.map(function (v) {
        return '<button class="tut-opt' + (sel && sel.id === v.id ? ' on' : '') + '" ' +
            'data-step="' + esc(st.key) + '" data-id="' + esc(v.id) + '">' +
          '<span class="tut-thumb">' + thumbHtml(v) +
            '<span class="tut-prev" data-play="' + esc(v.id) + '" role="button" title="미리보기">▶</span>' +
            '<span class="tut-check">✓</span>' +
            '<span class="tut-dur">' + esc(v.dur) + '</span>' +
          '</span>' +
          '<span class="tut-opt-t">' + esc(v.title) + '</span>' +
        '</button>';
      }).join('');

      return '<div class="tut-step cur">' + head +
        '<div class="tut-say">' + ch(st.pose, 118) +
          '<div class="say"><span class="nm">' + esc(GUIDE_NAME) + '</span>' + st.say + '</div></div>' +
        '<div class="tut-optbar">' +
          '<span class="lbl">후보 ' + o.total + '편 중 4편 — 썸네일의 ▶ 로 미리 볼 수 있어요</span>' +
          (o.total > 4 ? '<button class="btn btn-ghost btn-sm" data-roll="' + esc(st.key) + '">다른 영상 보기 ↻</button>' : '') +
        '</div>' +
        '<div class="tut-opts">' + opts + '</div>' +
      '</div>';
    }

    /* 이미 고른 단계 — 접어서 보여주고 바꾸기만 남긴다 */
    if (sel) {
      return '<div class="tut-step">' + head +
        '<div class="tut-picked">' +
          '<img alt="" class="yt-thumb" data-yt="' + esc(sel.yt || '') + '" ' +
            'src="' + esc(thumbUrl(sel.yt)) + '">' +
          '<span class="t"><b>' + esc(sel.title) + '</b>' +
            '<span>' + esc(sel.dur) + ' · ' + esc(catName(sel.c1)) + ' › ' + esc(subName(sel.c2)) + '</span></span>' +
          '<button class="btn btn-ghost btn-sm" data-play="' + esc(sel.id) + '">▶ 미리보기</button>' +
          '<button class="btn btn-ghost btn-sm" data-edit="' + i + '">바꾸기</button>' +
        '</div>' +
      '</div>';
    }

    /* 아직 차례가 아닌 단계 */
    return '<div class="tut-step lock">' + head +
      '<div class="tut-lockmsg">🔒 앞 단계를 먼저 고르면 열려요.</div></div>';
  }).join('');

  /* 네 단계를 다 고르면 수업표가 나온다 */
  if (act === -1) {
    var picks = TUT_STEPS.map(function (st) { return vById(TUT.sel[st.key]); }).filter(Boolean);
    var total = picks.reduce(function (a, v) { return a + durSec(v.dur); }, 0);

    html += '<div class="tut-sum">' +
      '<div class="tut-sum-head">' + ch('good', 108) +
        '<div class="t"><h4>수업 한 차시가 완성됐어요</h4>' +
        '<p>담은 순서 그대로 전체화면에서 이어 재생됩니다.</p></div></div>' +
      '<div class="tut-sum-list">' +
        picks.map(function (v, i) {
          var st = TUT_STEPS[i];
          return '<div class="tut-sum-row">' +
            '<span class="no" style="background:' + st.color + '">' + st.no + '</span>' +
            '<img alt="" class="yt-thumb" data-yt="' + esc(v.yt || '') + '" ' +
              'src="' + esc(thumbUrl(v.yt)) + '">' +
            '<span class="tt">' + esc(v.title) + '</span>' +
            '<span class="dd">' + esc(v.dur) + '</span>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<div class="tut-sum-foot">' +
        '<span class="tut-total">전체 <b>' + fmtMin(total) + '</b> · ' + picks.length + '편</span>' +
        '<button class="btn btn-primary btn-pill" id="tutPlay">▶ 이 수업 바로 시작</button>' +
        '<button class="btn btn-ghost btn-pill" id="tutCart">🎬 수업에 담기</button>' +
        '<button class="btn btn-ghost btn-pill" id="tutReset">처음부터 다시</button>' +
      '</div>' +
    '</div>';
  }

  var body = $('#tutBody');
  body.innerHTML = html;
  bindThumbFallback(body);

  /* 영상 선택 */
  $$('.tut-opt', body).forEach(function (b) {
    b.addEventListener('click', function () {
      TUT.sel[b.dataset.step] = b.dataset.id;
      TUT.edit = null;
      renderTut();
      var next = $('.tut-step.cur', $('#tutBody')) || $('.tut-sum', $('#tutBody'));
      if (next) next.scrollIntoView({ behavior:'smooth', block:'center' });
    });
  });
  /* 미리보기 — 기존 수업 플레이어를 그대로 쓴다 */
  $$('[data-play]', body).forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      openPlayer([el.dataset.play]);
    });
  });
  $$('[data-roll]', body).forEach(function (el) {
    el.addEventListener('click', function () {
      var k = el.dataset.roll;
      TUT.off[k] = (TUT.off[k] || 0) + 4;
      renderTut();
    });
  });
  $$('[data-edit]', body).forEach(function (el) {
    el.addEventListener('click', function () {
      TUT.edit = Number(el.dataset.edit);
      renderTut();
      var cur = $('.tut-step.cur', $('#tutBody'));
      if (cur) cur.scrollIntoView({ behavior:'smooth', block:'center' });
    });
  });

  if ($('#tutPlay')) {
    $('#tutPlay').addEventListener('click', function () {
      openPlayer(TUT_STEPS.map(function (st) { return TUT.sel[st.key]; }));
    });
    $('#tutCart').addEventListener('click', function () {
      if (needLogin('로그인하면 이 수업을 담아 둘 수 있습니다.')) return;
      var added = 0;
      TUT_STEPS.forEach(function (st) {
        if (S.cart.indexOf(TUT.sel[st.key]) < 0) { toggleCart(TUT.sel[st.key], true); added++; }
      });
      toast(added ? added + '편을 담았습니다. 왼쪽 ▶ 수업시작으로 이어가세요.' : '이미 모두 담겨 있습니다.');
    });
    $('#tutReset').addEventListener('click', function () {
      TUT.sel = {}; TUT.edit = null;
      renderTut();
      $('#gTut').scrollIntoView({ behavior:'smooth', block:'start' });
    });
  }
}

function bindMainHero() {
  var v = $('#mhVid');
  if (!v) return;

  /* 자동재생은 무음일 때만 허용된다. 탭이 숨겨져 있거나 정책에 막히면
     포스터 그림이 그대로 보이고, 데이터가 준비되거나 사용자가 처음 움직일 때 다시 시도한다. */
  function tryPlay() {
    if (!document.body.contains(v)) return;
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  }
  v.addEventListener('playing', function () { v.classList.add('on'); });
  v.addEventListener('canplay', tryPlay);
  v.addEventListener('loadeddata', tryPlay);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tryPlay(); });
  var once = function () {
    tryPlay();
    document.removeEventListener('pointerdown', once);
    document.removeEventListener('keydown', once);
  };
  document.addEventListener('pointerdown', once);
  document.addEventListener('keydown', once);
  tryPlay();

  $('#mhSound').addEventListener('click', function () {
    var b = $('#mhSound');
    v.muted = !v.muted;
    if (v.paused) tryPlay();
    b.textContent = v.muted ? '🔇' : '🔊';
    b.title = b.ariaLabel = v.muted ? '소리 켜기' : '소리 끄기';
  });

  $('#mhScroll').addEventListener('click', function () {
    var t = $('.search-row');
    if (t) t.scrollIntoView({ behavior:'smooth', block:'start' });
  });
}

        '<th>수업</th><th>출석부</th><th>리포트</th><th>수정</th><th>삭제</th>' +
      '</tr></thead><tbody>' +
      (pageList.length ? pageList.map(function (c, i) {
        return '<tr>' +
          '<td>' + ((cpage - 1) * CPS + i + 1) + '</td><td>' + esc(c.ym) + '</td><td class="t-left">' + esc(c.region) + '</td>' +
          '<td class="t-left t-strong">' + esc(c.school) + '</td><td>' + esc(c.grade) + '</td>' +
          '<td>' + esc(c.cls) + '</td><td>' + esc(c.cap) + '</td>' +
          '<td>' + (c.sched
            ? '<span class="sched-tag">' + esc(c.sched) + '</span>'
            : '<span class="sched-none">미연결</span>') + '</td>' +
          (adminView ? '<td><span class="owner-tag">' + esc(c.owner || '-') + '</span></td>' : '') +
          '<td><button class="ico-btn ico-play" data-run="' + esc(c.id) + '" title="오늘 수업 열기">▶</button></td>' +
          '<td><button class="ico-btn ico-att" data-att="' + esc(c.id) + '" title="출석부">📋</button></td>' +
          '<td><button class="ico-btn ico-rep" data-rep="' + esc(c.id) + '" title="수업 리포트 (인쇄·PDF)">📄</button></td>' +
          '<td><button class="ico-btn ico-edit" data-edit="' + esc(c.id) + '" title="수정">✏️</button></td>' +
          '<td><button class="ico-btn ico-del" data-del="' + esc(c.id) + '" title="삭제">🗑</button></td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="' + (adminView ? 14 : 13) + '" style="padding:56px;color:#94a3b8">' +
        (S.classes.length ? '검색 결과가 없습니다.' : '등록된 수업이 없습니다.') + '</td></tr>') +
      '</tbody></table></div>' +
      '<div class="pager" id="clsPager"></div>' +
    '</div>';

  // 수업관리 페이지네이션
  if (cpages > 1) {
    var ph = '<button ' + (cpage === 1 ? 'disabled' : '') + ' data-cp="1">‹‹</button>';
    var cf = Math.max(1, cpage - 2), ct = Math.min(cpages, cf + 4);
    cf = Math.max(1, ct - 4);
    for (var ci = cf; ci <= ct; ci++) {
      ph += '<button class="' + (ci === cpage ? 'on' : '') + '" data-cp="' + ci + '">' + ci + '</button>';
    }
    ph += '<button ' + (cpage === cpages ? 'disabled' : '') + ' data-cp="' + cpages + '">››</button>';
    $('#clsPager').innerHTML = ph;
    $$('#clsPager button').forEach(function (b) {
      b.addEventListener('click', function () {
        renderClasses._page = Number(b.dataset.cp); renderClasses();
      });
    });
  }

  function applySearch() {
    renderClasses._y = $('#fy').value;
    renderClasses._m = $('#fm').value;
    renderClasses._q = $('#fq').value.trim();
    renderClasses._f = $('#ff').value;
    renderClasses._page = 1;
    renderClasses();
  }
  $('#fSearch').addEventListener('click', applySearch);
  $('#fq').addEventListener('keydown', function (e) { if (e.key === 'Enter') applySearch(); });
  $('#fy').addEventListener('change', applySearch);
  $('#fm').addEventListener('change', applySearch);
  $('#fReset').addEventListener('click', function () {
    renderClasses._y = ''; renderClasses._m = ''; renderClasses._q = '';
    renderClasses._f = 'both'; renderClasses._page = 1;
    renderClasses();
  });
  $('#clsAdd').addEventListener('click', function () { classForm(null); });

  $$('[data-edit]').forEach(function (b) {
    b.addEventListener('click', function () {
      classForm(S.classes.filter(function (c) { return c.id === b.dataset.edit; })[0]);
    });
  });
  $$('[data-del]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!confirm('이 수업을 삭제할까요?')) return;
      srv('api_deleteClass', b.dataset.del, S.user.id).then(function (r) {
        if (r && !r.ok) { toast(r.msg || '삭제하지 못했습니다.'); return; }
        S.classes = S.classes.filter(function (c) { return c.id !== b.dataset.del; });
        renderClasses(); toast('삭제했습니다.');
      });
    });
  });
  $$('[data-att]').forEach(function (b) {
    b.addEventListener('click', function () { attendanceModal(b.dataset.att); });
  });
  $$('[data-run]').forEach(function (b) {
    b.addEventListener('click', function () { curriculumModal(b.dataset.run); });
  });
  $$('[data-rep]').forEach(function (b) {
    b.addEventListener('click', function () { reportModal(b.dataset.rep); });
  });
}

/* ── 학급 커리큘럼: 차시를 골라 바로 수업 시작 ── */

function curriculumModal(classId) {
  var c = S.classes.filter(function (x) { return x.id === classId; })[0];
  var title = c.school + ' ' + c.grade + '-' + c.cls + ' 수업';
  modal(title, '<div class="empty">불러오는 중...</div>', '');

  srv('api_classCurriculum', classId, S.user.id).then(function (r) {
    if (!r.ok) { modal(title, '<div class="empty"><b>' + esc(r.msg) + '</b></div>', ''); return; }

    if (!r.group) {
      modal(title,
        '<div class="empty"><span class="ico">🗂</span><b>연결된 커리큘럼이 없습니다</b>' +
        '수업 수정에서 프로그램 스케줄을 연결하면<br>여기서 차시를 바로 열 수 있습니다.</div>',
        '<button class="btn btn-ghost" id="mCancel">닫기</button>' +
        '<button class="btn btn-primary" id="curLink">수업 수정</button>');
      $('#mCancel').addEventListener('click', closeModal);
      $('#curLink').addEventListener('click', function () { closeModal(); classForm(c); });
      return;
    }

    var body = '<div class="cur-head"><span class="sched-tag">' + esc(r.group) + '</span>' +
               '<span class="cur-cnt">' + r.items.length + '차시</span></div>' +
      (r.items.length ? r.items.map(function (it) {
        var names = it.videoIds.map(function (id) {
          var v = vById(id); return v ? v.title : id;
        });
        var secs = it.videoIds.reduce(function (a, id) {
          var v = vById(id); return a + (v ? durSec(v.dur) : 0);
        }, 0);
        var mm = Math.round(secs / 60);
        return '<div class="cur-item">' +
          '<div class="cur-no">' + it.no + '차시</div>' +
          '<div class="cur-body">' +
            '<div class="cur-vids">' + esc(names.join(' · ')) + '</div>' +
            '<div class="cur-meta">영상 ' + it.videoIds.length + '편 · 약 ' + mm + '분</div>' +
          '</div>' +
          '<button class="btn btn-primary btn-sm" data-curplay="' + esc(it.videoIds.join(',')) + '">▶ 시작</button>' +
        '</div>';
      }).join('')
        : '<div class="empty"><b>차시가 비어 있습니다</b>프로그램 스케줄에서 차시를 추가해 주세요.</div>');

    modal(title, body, '<button class="btn btn-ghost" id="mCancel">닫기</button>');
    $('#mCancel').addEventListener('click', closeModal);
    $$('[data-curplay]').forEach(function (b) {
      b.addEventListener('click', function () {
        closeModal();
        openPlayer(b.dataset.curplay.split(','));
      });
    });
  });
}

function defRow(k, v) { return '<div class="defrow"><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }
function fld(label, input) { return '<label class="fld"><span>' + label + '</span>' + input + '</label>'; }

function classForm(c) {
  var isNew = !c;
  c = c || { ym: '', region: '', school: '', grade: 1, cls: 1, cap: 20, memo: '', sched: '' };

  // 내 스케줄 그룹을 불러와 선택지로 준다
  srv('api_schedules', S.user.id).then(function (groups) {
    var opts = '<option value="">— 연결 안 함 —</option>' +
      (groups || []).map(function (g) {
        return '<option value="' + esc(g.name) + '"' + (g.name === c.sched ? ' selected' : '') + '>' +
          esc(g.name) + ' (' + g.items.length + '차시)</option>';
      }).join('');
    // 남이 만든 그룹이 이미 연결돼 있으면 목록에 없더라도 유지
    if (c.sched && !(groups || []).some(function (g) { return g.name === c.sched; })) {
      opts += '<option value="' + esc(c.sched) + '" selected>' + esc(c.sched) + '</option>';
    }

    var body =
      '<div class="form-grid">' +
        fld('수업년월', '<input type="month" id="cYm" value="' + esc(c.ym) + '">') +
        fld('정원', '<input type="number" id="cCap" value="' + esc(c.cap) + '" min="1">') +
        fld('지역', '<input type="text" id="cRegion" value="' + esc(c.region) + '" placeholder="울산광역시 북구">') +
        fld('학교', '<input type="text" id="cSchool" value="' + esc(c.school) + '" placeholder="강동초등학교">') +
        fld('학년', '<input type="number" id="cGrade" value="' + esc(c.grade) + '" min="1" max="6">') +
        fld('반', '<input type="number" id="cCls" value="' + esc(c.cls) + '" min="1">') +
        '<div class="full">' + fld('커리큘럼 (프로그램 스케줄)',
          '<select id="cSched">' + opts + '</select>') + '</div>' +
        '<div class="full">' + fld('메모', '<input type="text" id="cMemo" value="' + esc(c.memo) + '">') + '</div>' +
      '</div>' +
      '<p class="form-note">커리큘럼을 연결하면 수업관리 표의 <b>▶</b> 버튼으로 차시를 바로 열 수 있습니다.</p>';

    modal(isNew ? '수업 등록' : '수업 수정', body,
      '<button class="btn btn-ghost" id="mCancel">취소</button>' +
      '<button class="btn btn-primary" id="mSave">저장</button>');

    $('#mCancel').addEventListener('click', closeModal);
    $('#mSave').addEventListener('click', doSave);
  });

  function doSave() {
    var obj = {
      id: isNew ? '' : c.id,
      ym: $('#cYm').value, region: $('#cRegion').value.trim(), school: $('#cSchool').value.trim(),
      grade: Number($('#cGrade').value), cls: Number($('#cCls').value),
      cap: Number($('#cCap').value), memo: $('#cMemo').value.trim(),
      sched: $('#cSched').value
    };
    if (!obj.ym || !obj.school) { toast('수업년월과 학교는 필수입니다.'); return; }
    $('#mSave').disabled = true;
    srv('api_saveClass', S.user.id, obj).then(function (r) {
      if (!r.ok) { toast(r.msg); $('#mSave').disabled = false; return; }
      closeModal();
      return srv('api_classes', S.user.id).then(function (rows) {
        S.classes = rows; renderClasses(); toast('저장했습니다.');
      });
    });
  }
}

function todayStr() {
  var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/** 출석부 — 날짜별로 회차가 쌓인다 */
function attendanceModal(classId, date) {
  var c = S.classes.filter(function (x) { return x.id === classId; })[0];
  var ttl = '출석부 · ' + c.school + ' ' + c.grade + '-' + c.cls;
  modal(ttl, '<div class="empty">불러오는 중...</div>', '');

  srv('api_attendance', classId, date || '').then(function (r) {
    var rows = r.list || [], dates = r.dates || [];

    var body =
      '<div class="att-bar">' +
        '<label class="att-date"><span>날짜</span>' +
          '<input type="date" id="attDate" value="' + esc(r.date) + '"></label>' +
        (dates.length
          ? '<select id="attHist"><option value="">지난 회차 ' + dates.length + '건</option>' +
              dates.map(function (d) {
                return '<option value="' + esc(d) + '"' + (d === r.date ? ' selected' : '') + '>' + esc(d) + '</option>';
              }).join('') + '</select>'
          : '') +
        '<button class="btn btn-ghost btn-sm" id="attStat">📊 누적</button>' +
      '</div>' +
      (r.isNew
        ? '<p class="att-note">이 날짜는 아직 기록이 없습니다. 최근 회차(' + esc(dates[0] || '-') +
          ') 명단을 불러왔고, 출결은 모두 <b>출</b>로 두었습니다.</p>'
        : '') +
      '<div style="margin-bottom:12px;display:flex;gap:8px">' +
        '<input type="text" id="newStu" placeholder="학생 이름" style="flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px">' +
        '<button class="btn btn-ghost btn-sm" id="addStu">＋ 추가</button>' +
        '<button class="btn btn-ghost btn-sm" id="allPresent">모두 출석</button>' +
      '</div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>학생명</th><th>출결</th><th></th></tr></thead><tbody id="attBody">' +
      (rows.length ? rows.map(function (x, i) { return attRow(x.name, x.status, i); }).join('')
                   : '<tr><td colspan="3" style="padding:40px;color:#64748b">등록된 학생이 없습니다.</td></tr>') +
      '</tbody></table></div>';

    modal(ttl, body,
      (dates.indexOf(r.date) >= 0
        ? '<button class="btn btn-ghost" id="attDel" style="margin-right:auto;color:#e11d48">이 회차 삭제</button>' : '') +
      '<button class="btn btn-ghost" id="mCancel">닫기</button>' +
      '<button class="btn btn-primary" id="attSave">저장</button>');

    $('#mCancel').addEventListener('click', closeModal);

    // 날짜 이동
    $('#attDate').addEventListener('change', function () {
      attendanceModal(classId, $('#attDate').value);
    });
    if ($('#attHist')) {
      $('#attHist').addEventListener('change', function () {
        if ($('#attHist').value) attendanceModal(classId, $('#attHist').value);
      });
    }

    $('#addStu').addEventListener('click', function () {
      var nm = $('#newStu').value.trim(); if (!nm) return;
      var tb = $('#attBody');
      if (tb.querySelector('td[colspan]')) tb.innerHTML = '';
      tb.insertAdjacentHTML('beforeend', attRow(nm, '출', tb.children.length));
      $('#newStu').value = ''; bindAttDel();
    });
    $('#newStu').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#addStu').click(); });
    $('#allPresent').addEventListener('click', function () {
      $$('#attBody select').forEach(function (s) { s.value = '출'; });
      toast('모두 출석으로 표시했습니다.');
    });
    bindAttDel();

    $('#attSave').addEventListener('click', function () {
      var d = $('#attDate').value || todayStr();
      var list = $$('#attBody tr[data-nm]').map(function (tr) {
        return { name: tr.dataset.nm, status: $('select', tr).value };
      });
      $('#attSave').disabled = true;
      srv('api_saveAttendance', classId, d, list).then(function () {
        closeModal(); toast(d + ' 출석부를 저장했습니다.');
      });
    });

    if ($('#attDel')) {
      $('#attDel').addEventListener('click', function () {
        if (!confirm(r.date + ' 회차를 삭제할까요?')) return;
        srv('api_deleteAttendanceDate', classId, r.date).then(function () {
          closeModal(); toast('회차를 삭제했습니다.');
        });
      });
    }

    $('#attStat').addEventListener('click', function () { attendanceSummary(classId, ttl); });
  });
}

/** 누적 출결 통계 */
function attendanceSummary(classId, ttl) {
  modal(ttl + ' · 누적', '<div class="empty">집계 중...</div>', '');
  srv('api_attendanceSummary', classId).then(function (rows) {
    rows.sort(function (a, b) { return b.결 - a.결 || a.name.localeCompare(b.name, 'ko'); });
    var body = rows.length
      ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>학생명</th><th>출</th><th>결</th><th>지</th><th>조</th><th>출석률</th>' +
        '</tr></thead><tbody>' +
        rows.map(function (r) {
          var rate = r.total ? Math.round(r['출'] / r.total * 100) : 0;
          return '<tr><td class="t-left t-strong">' + esc(r.name) + '</td>' +
            '<td>' + r['출'] + '</td>' +
            '<td' + (r['결'] ? ' style="color:#e11d48;font-weight:700"' : '') + '>' + r['결'] + '</td>' +
            '<td>' + r['지'] + '</td><td>' + r['조'] + '</td>' +
            '<td><b>' + rate + '%</b></td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="empty"><b>기록이 없습니다</b></div>';
    modal(ttl + ' · 누적', body,
      '<button class="btn btn-ghost" id="mBack">← 출석부</button>' +
      '<button class="btn btn-primary" id="mCancel">닫기</button>');
    $('#mCancel').addEventListener('click', closeModal);
    $('#mBack').addEventListener('click', function () { attendanceModal(classId); });
  });
}

function attRow(name, status, i) {
  var opts = ['출', '결', '지', '조'].map(function (s) {
    return '<option ' + (s === status ? 'selected' : '') + '>' + s + '</option>';
  }).join('');
  return '<tr data-nm="' + esc(name) + '"><td class="t-left t-strong">' + esc(name) + '</td>' +
    '<td><select style="border:1px solid #cbd5e1;border-radius:7px;padding:6px 9px">' + opts + '</select></td>' +
    '<td><button class="ico-btn ico-del" data-attdel="' + i + '">🗑</button></td></tr>';
}
function bindAttDel() {
  $$('[data-attdel]').forEach(function (b) { b.onclick = function () { b.closest('tr').remove(); }; });
}

/* ═══════════ 내 출결 (학생·학부모) ═══════════ */

var ST_LABEL = { '출': '출석', '결': '결석', '지': '지각', '조': '조퇴' };

function viewMyAttendance() {
  $('#view').innerHTML =
    '<div class="page-head"><h1 class="page-title">내 출결</h1>' +
    '<p class="page-desc">수업별 출결 기록과 출석률을 확인합니다.</p></div>' +
    '<div id="myaWrap">' + skelPanel() + '</div>';

  srv('api_myAttendance', S.user.id).then(function (r) {
    if (!r.ok) { $('#myaWrap').innerHTML = '<div class="empty"><b>' + esc(r.msg) + '</b></div>'; return; }

    if (!r.classes.length) {
      $('#myaWrap').innerHTML =
        '<div class="panel panel-pad" style="max-width:820px;margin:0 auto">' +
        '<div class="empty"><span class="ico">🗓</span><b>출결 기록이 없습니다</b>' +
        '<b style="font-size:13px;color:#64748b;font-weight:500">「' + esc(r.name) + '」</b> 이름으로 등록된 출결이 아직 없습니다.<br>' +
        '선생님이 출석부에 이름을 등록하면 여기에 나타납니다.</div></div>';
      return;
    }

    $('#myaWrap').innerHTML = '<div style="max-width:900px;margin:0 auto">' +
      r.classes.map(function (c) {
        var bar = c.rate >= 90 ? 'ok' : (c.rate >= 70 ? 'warn' : 'bad');
        return '<div class="panel" style="margin-bottom:18px">' +
          '<div class="mya-head">' +
            '<div><div class="mya-cls">' + esc(c.className) + '</div>' +
            '<div class="mya-sub">전체 ' + c.total + '회</div></div>' +
            '<div class="mya-rate ' + bar + '"><b>' + c.rate + '%</b><span>출석률</span></div>' +
          '</div>' +
          '<div class="mya-stat">' +
            ['출', '결', '지', '조'].map(function (k) {
              return '<div class="mya-cell' + (k === '결' && c[k] ? ' bad' : '') + '">' +
                '<b>' + c[k] + '</b><span>' + ST_LABEL[k] + '</span></div>';
            }).join('') +
          '</div>' +
          '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>출결</th></tr></thead><tbody>' +
            c.records.map(function (x) {
              return '<tr><td>' + esc(x.date) + '</td>' +
                '<td><span class="st-chip st-' + (x.status === '출' ? 'ok' : (x.status === '결' ? 'bad' : 'mid')) + '">' +
                esc(ST_LABEL[x.status] || x.status) + '</span></td></tr>';
            }).join('') +
          '</tbody></table></div>' +
        '</div>';
      }).join('') + '</div>';
  }).catch(function (e) { $('#myaWrap').innerHTML = errBox(e); });
}

/* ═══════════ 수업 리포트 (인쇄 · PDF) ═══════════ */

function reportModal(classId) {
  modal('수업 리포트', '<div class="empty">리포트를 만드는 중...</div>', '');

  srv('api_classReport', classId, S.user.id).then(function (r) {
    if (!r.ok) { modal('수업 리포트', '<div class="empty"><b>' + esc(r.msg) + '</b></div>', ''); return; }

    var html = buildReport(r);
    modal('수업 리포트 · ' + r.cls.school + ' ' + r.cls.grade + '-' + r.cls.cls,
      '<div class="report-preview">' + html + '</div>',
      '<button class="btn btn-ghost" id="mCancel">닫기</button>' +
      '<button class="btn btn-primary" id="repPrint">🖨 인쇄 / PDF 저장</button>');

    $('#mCancel').addEventListener('click', closeModal);
    $('#repPrint').addEventListener('click', function () {
      var pa = $('#printArea');
      pa.innerHTML = html;
      pa.hidden = false;
      document.body.classList.add('printing');
      window.print();
      // 인쇄 대화상자가 닫힌 뒤 정리
      setTimeout(function () {
        document.body.classList.remove('printing');
        pa.hidden = true;
        pa.innerHTML = '';
      }, 800);
    });
  });
}

function viewMembers() {
  $('#view').innerHTML =
    '<div class="page-head"><h1 class="page-title">회원관리</h1>' +
    '<p class="page-desc">가입한 회원의 권한을 바꾸고 계정을 정지하거나 비밀번호를 초기화합니다.</p></div>' +
    '<div id="memWrap">' + skelPanel() + '</div>';

  srv('api_members', S.user.id).then(function (r) {
    if (!r.ok) { $('#memWrap').innerHTML = '<div class="empty"><b>' + esc(r.msg) + '</b></div>'; return; }
    viewMembers._data = r;
    renderMembers();
  }).catch(function (e) { $('#memWrap').innerHTML = errBox(e); });
}

function renderMembers() {
  var r = viewMembers._data;
  var q = (renderMembers._q || '').toLowerCase();
  var fr = renderMembers._role || '';

  var list = r.members.filter(function (m) {
    if (fr && m.role !== fr) return false;
    if (q && (m.id + ' ' + m.name + ' ' + m.org).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });

  var counts = {};
  r.roles.forEach(function (ro) {
    counts[ro] = r.members.filter(function (m) { return m.role === ro; }).length;
  });

  $('#memWrap').innerHTML =
    '<div class="panel">' +
      '<div class="toolbar">' +
        '<div class="toolbar-l">' +
          r.roles.map(function (ro) {
            return '<button class="chip' + (fr === ro ? ' on' : '') + '" data-role="' + esc(ro) + '">' +
              esc(ro) + '<span class="chip-count">' + counts[ro] + '</span></button>';
          }).join('') +
          '<button class="chip' + (fr === '' ? ' on' : '') + '" data-role="">전체' +
            '<span class="chip-count">' + r.members.length + '</span></button>' +
        '</div>' +
        '<div class="toolbar-r">' +
          '<input type="text" id="memQ" placeholder="아이디 · 이름 · 소속" value="' + esc(renderMembers._q || '') + '" style="min-width:200px">' +
          '<button class="btn btn-primary btn-sm" id="memSearch">🔍 검색</button>' +
        '</div>' +
      '</div>' +
      '<div class="count-row"><span class="count-txt">전체 <b>' + r.members.length + '</b> / 검색 <b>' + list.length + '</b></span></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>아이디</th><th>이름</th><th>소속</th><th>가입일</th>' +
        '<th>수업</th><th>교구</th><th>스케줄</th><th>권한</th><th>상태</th><th>비밀번호</th>' +
      '</tr></thead><tbody>' +
      (list.length ? list.map(function (m) {
        var me = (m.id === S.user.id);
        return '<tr' + (me ? ' class="me-row"' : '') + '>' +
          '<td class="t-left t-strong">' + esc(m.id) + (me ? '<span class="me-tag">나</span>' : '') + '</td>' +
          '<td>' + esc(m.name) + '</td>' +
          '<td class="t-left">' + (esc(m.org) || '-') + '</td>' +
          '<td>' + esc(m.joined) + '</td>' +
          '<td>' + m.classCount + '</td><td>' + m.equipCount + '</td><td>' + m.schedCount + '</td>' +
          '<td><select class="role-sel" data-uid="' + esc(m.id) + '"' + (me ? ' disabled title="자기 자신은 바꿀 수 없습니다"' : '') + '>' +
            viewMembers._data.roles.map(function (ro) {
              return '<option' + (ro === m.role ? ' selected' : '') + '>' + esc(ro) + '</option>';
            }).join('') + '</select></td>' +
          '<td>' + (me ? '<span class="st-tag st-ok">정상</span>'
            : '<button class="st-tag ' + (m.status === '정상' ? 'st-ok' : 'st-off') + '" data-st="' + esc(m.id) +
              '" data-cur="' + esc(m.status) + '">' + esc(m.status) + '</button>') + '</td>' +
          '<td><button class="btn btn-ghost btn-sm" data-pw="' + esc(m.id) + '">초기화</button></td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="10" style="padding:50px;color:#64748b">검색 결과가 없습니다.</td></tr>') +
      '</tbody></table></div>' +
    '</div>';

  $$('#memWrap .chip').forEach(function (b) {
    b.addEventListener('click', function () { renderMembers._role = b.dataset.role; renderMembers(); });
  });
  $('#memSearch').addEventListener('click', function () {
    renderMembers._q = $('#memQ').value.trim(); renderMembers();
  });
  $('#memQ').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#memSearch').click(); });

  // 권한 변경
  $$('.role-sel').forEach(function (sel) {
    sel.addEventListener('change', function () {
      var uid = sel.dataset.uid, role = sel.value;
      sel.disabled = true;
      srv('api_setMemberRole', S.user.id, uid, role).then(function (res) {
        sel.disabled = false;
        if (!res.ok) { toast(res.msg); viewMembers(); return; }
        var m = viewMembers._data.members.filter(function (x) { return x.id === uid; })[0];
        if (m) m.role = role;
        toast(uid + ' → ' + role + ' 로 변경했습니다.');
        renderMembers();
      });
    });
  });

  // 정지 / 복구
  $$('[data-st]').forEach(function (b) {
    b.addEventListener('click', function () {
      var uid = b.dataset.st, next = (b.dataset.cur === '정상') ? '정지' : '정상';
      if (next === '정지' && !confirm(uid + ' 계정을 정지할까요? 로그인할 수 없게 됩니다.')) return;
      srv('api_setMemberStatus', S.user.id, uid, next).then(function (res) {
        if (!res.ok) { toast(res.msg); return; }
        var m = viewMembers._data.members.filter(function (x) { return x.id === uid; })[0];
        if (m) m.status = res.status;
        toast(uid + ' 계정을 ' + res.status + ' 처리했습니다.');
        renderMembers();
      });
    });
  });

  // 비밀번호 초기화
  $$('[data-pw]').forEach(function (b) {
    b.addEventListener('click', function () {
      var uid = b.dataset.pw;
      modal('비밀번호 초기화',
        '<p style="margin:0 0 14px;font-size:13.5px;color:#475569"><b>' + esc(uid) + '</b> 의 비밀번호를 새로 설정합니다.</p>' +
        fld('새 비밀번호', '<input type="text" id="newPw" value="1234" placeholder="4자 이상">'),
        '<button class="btn btn-ghost" id="mCancel">취소</button>' +
        '<button class="btn btn-primary" id="pwOk">변경</button>');
      $('#mCancel').addEventListener('click', closeModal);
      $('#pwOk').addEventListener('click', function () {
        var pw = $('#newPw').value;
        if (!pw || pw.length < 4) { toast('4자 이상 입력하세요.'); return; }
        $('#pwOk').disabled = true;
        srv('api_resetMemberPw', S.user.id, uid, pw).then(function (res) {
          if (!res.ok) { toast(res.msg); $('#pwOk').disabled = false; return; }
          closeModal(); toast(uid + ' 비밀번호를 변경했습니다.');
        });
      });
    });
  });
}

        '<h4>⚠ 회원가입 불가능 기간</h4>' +
        '<p>회원탈퇴 이후, 7일간 회원가입은 불가능합니다.</p>' +
        '<p>탈퇴와 재가입을 통하여 아이디를 교체하면서 다른 회원님들께 피해를 끼치는 행위를 방지하기 위한 조치이오니 넓은 양해 바랍니다.</p>' +
      '</div>' +
      '<dl class="deflist" style="border:1px solid #e2e8f0;border-radius:12px;overflow:hidden">' +
        defRow('아이디', '<input type="text" id="wId" value="' + esc(S.user.id) + '" readonly>') +
        defRow('비밀번호', '<input type="password" id="wPw">') +
        '<div class="defrow"><dt>탈퇴사유</dt><dd style="flex-direction:column;align-items:flex-start">' +
          '<div class="radio-list">' + reasons.map(function (r, i) {
            return '<label><input type="radio" name="wr" value="' + esc(r) + '" ' + (i === 0 ? 'checked' : '') + '>' + esc(r) + '</label>';
          }).join('') + '</div>' +
          '<textarea id="wDetail" placeholder="자세한 사유를 적어주세요 (선택)" style="margin-top:14px"></textarea>' +
        '</dd></div>' +
      '</dl>' +
      '<p style="margin:18px 0 0;font-size:13px;color:#64748b">정말 회원탈퇴를 하시겠습니까?</p>' +
      '<button class="btn btn-danger btn-block" id="wBtn" style="margin-top:12px">회원탈퇴</button>' +
    '</div>';

  $('#wBtn').addEventListener('click', function () {
    if (!$('#wPw').value) { toast('비밀번호를 입력하세요.'); return; }
    if (!confirm('정말 탈퇴하시겠습니까? 되돌릴 수 없습니다.')) return;
    var reason = ($('input[name=wr]:checked') || {}).value || '';
    $('#wBtn').disabled = true;
    srv('api_withdraw', S.user.id, $('#wPw').value, reason, $('#wDetail').value.trim())
      .then(function (r) {
        if (!r.ok) { toast(r.msg); $('#wBtn').disabled = false; return; }
        alert('탈퇴 처리되었습니다.');
        try { localStorage.removeItem('sj_user'); } catch (e) {}
        location.reload();
      });
  });
}

/* ═══════════ 온라인교재 ═══════════ */

function viewTextbook() {
  $('#view').innerHTML =
    '<div class="page-head"><h1 class="page-title">온라인교재</h1></div>' +
    '<div class="search-row"><div class="search-box">' +
      '<input type="text" id="bq" placeholder="교재명으로 검색"><button id="bqBtn">🔍</button>' +
    '</div></div><div id="bkWrap">' + skelPanel() + '</div>';

  srv('api_textbooks').then(function (books) {
    viewTextbook._all = books;
    drawBooks(books);
    $('#bqBtn').addEventListener('click', filterBooks);
    $('#bq').addEventListener('keydown', function (e) { if (e.key === 'Enter') filterBooks(); });
  }).catch(function (e) { $('#bkWrap').innerHTML = errBox(e); });
}

function filterBooks() {
  var q = $('#bq').value.trim().toLowerCase();
  drawBooks(viewTextbook._all.filter(function (b) { return b.title.toLowerCase().indexOf(q) >= 0; }));
}

function drawBooks(books) {
  if (!books.length) {
    $('#bkWrap').innerHTML = '<div class="empty"><span class="ico">📚</span><b>교재가 없습니다</b></div>';
    return;
  }
  $('#bkWrap').innerHTML = '<div class="book-grid">' + books.map(function (b) {
    var cover = b.cover
      ? '<img src="' + esc(b.cover) + '" alt="">'
      : '<div class="bt1">스마트점핑</div><div class="bt2">SMART JUMPING</div>' +
        '<div class="bt3">' + ('0' + b.no).slice(-2) + '</div>';
    return '<div class="book" data-link="' + esc(b.link) + '">' +
      '<div class="book-cover">' + cover +
        (b.badge ? '<span class="book-badge">' + esc(b.badge) + '</span>' : '') +
      '</div><div class="book-name">' + esc(b.title) + '</div></div>';
  }).join('') + '</div>';

  $$('.book').forEach(function (el) {
    el.addEventListener('click', function () {
      if (el.dataset.link) { window.open(el.dataset.link, '_blank'); return; }
      var name = el.querySelector('.book-name').textContent;
      modal(name, window.SJ_DEMO
        ? '<div class="empty"><span class="ico">📖</span><b>데모에는 교재 원문이 없습니다</b>' +
          '온라인교재는 실제 운영판에서 각 권의 뷰어로 연결됩니다.<br>' +
          '검색 · 뱃지 · 그리드까지는 여기서 그대로 확인할 수 있습니다.</div>'
        : '<div class="empty"><span class="ico">📖</span><b>뷰어 링크가 아직 없습니다</b>' +
          '시트 <b>textbooks</b> 탭의 <b>뷰어링크</b> 열을 채우면 클릭할 때 그 주소가 열립니다.</div>');
    });
  });
}

/* ═══════════ 공통 ═══════════ */

function modal(title, body, foot) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFoot').innerHTML = foot || '';
  $('#modalFoot').hidden = !foot;
  $('#modal').hidden = false;
}
function closeModal() { $('#modal').hidden = true; }
$('#modalX').addEventListener('click', closeModal);
$('#modal').addEventListener('click', function (e) { if (e.target === $('#modal')) closeModal(); });

function skelPanel() {
  var r = '';
  for (var i = 0; i < 5; i++) r += '<div class="sk" style="height:48px;border-radius:9px;margin-bottom:11px"></div>';
  return '<div class="panel panel-pad">' + r + '</div>';
}

function errBox(e) {
  return '<div class="empty"><span class="ico">⚠️</span><b>불러오지 못했습니다</b>' +
    esc(e && e.message ? e.message : e) + '</div>';
}

/* ═══════════ 앱 시작 ═══════════
   저장된 세션이 있으면 이어서, 없으면 게스트로 바로 콘텐츠를 띄운다.
   ※ 위쪽 선언(GUEST_NAV 등)이 모두 끝난 뒤 실행돼야 하므로 파일 맨 끝에 둔다. */
(function () {
  try {
    var saved = localStorage.getItem('sj_user');
    if (saved) S.user = JSON.parse(saved);
  } catch (e) {}
  startApp();
})();
</script>
